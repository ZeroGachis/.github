name: "Github-ReleasePlease"

on:
  workflow_call:
    inputs:
      major_and_minor_tags:
        required: false
        type: string
      release_type:
        required: false
        type: string
      release_please_command:
        required: false
        type: string
        default: ""
      release_please_config_file:
        required: false
        type: string
        default: release-please-config.json
      release_please_manifest_file:
        required: false
        type: string
        default: .release-please-manifest.json
      target_branch:
        required: false
        type: string
        default: main
      create_gh_release:
        required: false
        type: string
        default: "true"
      include_commit_authors:
        required: false
        type: string
        default: "true"
    outputs:
      release_created:
        description: "Whether a release was created"
        value: ${{ jobs.github-releaseplease.outputs.release_created }}
      release_number:
        description: "The release number"
        value: ${{ jobs.github-releaseplease.outputs.release_number }}
      paths_released:
        description: "The paths released"
        value: ${{ jobs.github-releaseplease.outputs.paths_released }}
  push:
    branches:
      - "main"

jobs:
  github-releaseplease:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.releases_created }}
      release_number: ${{ steps.release.outputs.tag_name }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    # Input defaults don't apply on `push`, so fall back explicitly.
    env:
      major_and_minor_tags: ${{ inputs.major_and_minor_tags || 'true' }}
      create_gh_release: ${{ inputs.create_gh_release || 'true' }}
      include_commit_authors: ${{ inputs.include_commit_authors || 'true' }}
    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SW_BOT_APP_ID || secrets.SW_BOT_PUBLIC_APP_ID }}
          private-key: ${{ secrets.SW_BOT_APP_PRIVATE_KEY || secrets.SW_BOT_PUBLIC_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.generate-token.outputs.token }}

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          release-type: ${{ inputs.release_type }}
          config-file: ${{ inputs.release_please_config_file }}
          manifest-file: ${{ inputs.release_please_manifest_file }}
          target-branch: ${{ inputs.target_branch }}
          token: ${{ steps.generate-token.outputs.token }}

      # release-please cannot list commit authors, so we append them to each changelog line
      # of the release PR description. Authors are wrapped in backticks to avoid pinging them
      # every time release-please regenerates the PR.
      - name: Add commit authors to the release PR
        if: ${{ steps.release.outputs.pr && env.include_commit_authors == 'true' }}
        uses: actions/github-script@v8
        env:
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const pull_number = JSON.parse(process.env.RELEASE_PR).number;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });

            // Matches "[abc1234](https://.../commit/abc1234))" in a changelog line, plus the
            // " by `author`" suffix of a previous run so it is replaced, not duplicated.
            const commitLink = /(\[(?<sha>[0-9a-f]{7,})\]\([^)]*\)\))(?: by `[^`]*`)?/g;
            const shas = new Set([...pr.body.matchAll(commitLink)].map((match) => match.groups.sha));

            const authorBySha = new Map();
            for (const sha of shas) {
              const { data: commit } = await github.rest.repos.getCommit({ owner, repo, ref: sha });
              authorBySha.set(sha, commit.author?.login ?? commit.commit.author.name);
            }

            const body = pr.body.replace(
              commitLink,
              (_match, link, sha) => `${link} by \`${authorBySha.get(sha)}\``,
            );
            await github.rest.pulls.update({ owner, repo, pull_number, body });

      - name: tag major and minor versions
        if: ${{ steps.release.outputs.release_created == 'true' && env.major_and_minor_tags == 'true' && env.create_gh_release == 'true' }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git remote add gh-token "https://${{ steps.generate-token.outputs.token }}@github.com/googleapis/release-please-action.git"
          git tag -d v${{ steps.release.outputs.major }} || true
          git tag -d v${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }} || true
          git push origin :v${{ steps.release.outputs.major }} || true
          git push origin :v${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }} || true
          git tag -a v${{ steps.release.outputs.major }} -m "Release v${{ steps.release.outputs.major }}"
          git tag -a v${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }} -m "Release v${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}"
          git push origin v${{ steps.release.outputs.major }}
          git push origin v${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}
